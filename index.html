<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Exercises</title>

    <link rel="manifest" href="./manifest.json">
    <script>
      if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./service-worker.js");
      }
    </script>

    <style>
      :root {
        --gap:14px; --r:16px;
        --bg:#0c0c14; --card:#151520; --card-border:#1e1e30;
        --text:#e8e8f0; --text-muted:rgba(232,232,240,.55);
        --accent:#818cf8;
        --clr-motor:#818cf8; --clr-rehab:#38bdf8; --clr-strength:#c084fc; --clr-cond:#fb7185;
        --done-glow:rgba(74,222,128,.12);
        font-family: -apple-system, system-ui, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
      }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); }
      .wrap { padding: max(env(safe-area-inset-top),24px) max(env(safe-area-inset-right),20px) max(env(safe-area-inset-bottom),24px) max(env(safe-area-inset-left),20px);
              max-width:720px; margin:0 auto; }
      h1 { margin:0 0 6px; font-size:24px; font-weight:700; letter-spacing:-.3px; }
      h2.section { margin:20px 0 10px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); }

      /* --- List Items --- */
      .list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
      .list-item { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:14px 16px;
                   color:var(--text); text-decoration:none; border:1px solid var(--card-border); border-left:3px solid var(--item-accent, var(--card-border));
                   position:relative; transition:background .15s ease, transform .1s ease, box-shadow .25s ease, border-color .2s ease;
                   -webkit-user-select:none; user-select:none; }
      .list-item:active { transform:scale(.98); }
      .list-item.done { border-left-color:#4ade80; box-shadow:0 0 16px var(--done-glow), 0 2px 8px rgba(0,0,0,.2); }
      .list-item-text { flex:1; min-width:0; }
      .list-item-name { font-size:14px; font-weight:600; line-height:1.2; }
      .list-item-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
      .list-item-count { text-align:right; font-variant-numeric:tabular-nums; min-width:3ch; }
      .list-item-count-val { display:block; font-size:14px; font-weight:700; }
      .list-item-count-unit { display:block; font-size:11px; color:var(--text-muted); line-height:1; }
      .list-item.done .list-item-count-val { color:#4ade80; }

      /* --- Detail Card --- */
      .card { max-width:560px; margin:0 auto; background:var(--card); border-radius:var(--r); padding:24px; border:1px solid var(--card-border); }
      .back { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; color:var(--accent); text-decoration:none; font-size:14px; font-weight:500; }
      .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .muted { color:var(--text-muted); font-size:13px; }
      .btn { border:0; border-radius:14px; padding:14px 18px; background:#1c1c2e; color:var(--text); font-size:19px; font-weight:500; line-height:1;
             cursor:pointer; transition: transform .1s ease, background .15s ease; border:1px solid var(--card-border); }
      .btn:hover { background:#24243a; }
      .btn:active { transform: scale(0.95); }
      label { display:block; margin:20px 0 6px; font-size:13px; font-weight:500; color:var(--text-muted); }
      input[type="date"] { font-size:14px; padding:10px 12px; border-radius:10px; border:1px solid var(--card-border); background:var(--bg); color:var(--text); }
      .note { color:var(--text-muted); font-size:13px; margin-top:12px; min-height:1em; transition:opacity .2s; }

      /* --- Steppers (one row per field: sets, reps/unit, weight) --- */
      .steppers { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
      .step-row { display:flex; align-items:center; gap:12px; }
      .step-label { width:62px; flex-shrink:0; font-size:13px; font-weight:600; color:var(--text-muted); }
      .step-val { flex:1; font-variant-numeric:tabular-nums; font-size:30px; font-weight:700; text-align:center; letter-spacing:-.5px; }
      .step-unit { width:30px; flex-shrink:0; text-align:left; }
      .entry-total { margin-top:12px; font-size:13px; font-variant-numeric:tabular-nums; }

      .chart-wrap { margin-top:20px; background:var(--bg); border:1px solid var(--card-border); border-radius:14px; padding:14px; }
      .chart-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 8px; flex-wrap:wrap; }
      .seg { display:inline-flex; background:#1c1c2e; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; }
      .seg button { border:0; background:transparent; color:var(--text-muted); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer; transition:background .15s ease, color .15s ease; }
      .seg button + button { border-left:1px solid var(--card-border); }
      .seg button.active { background:#2a2a40; color:var(--text); }
      canvas { width:100%; height:180px; display:block; cursor:grab; touch-action:none; }

      /* --- Toolbar --- */
      .toolbar { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
      .toolbar-btn { border:0; border-radius:10px; padding:9px 14px; background:#1c1c2e; color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer;
                     border:1px solid var(--card-border); transition: transform .1s ease, background .15s ease, color .15s ease; }
      .toolbar-btn:hover { background:#24243a; color:var(--text); }
      .toolbar-btn:active { transform: scale(0.97); }

      /* --- Stats --- */
      .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap:8px; margin-top:16px; }
      .stat { background:var(--bg); border:1px solid var(--card-border); border-radius:12px; padding:12px 8px; text-align:center; }
      .stat-info-trigger { width:100%; color:inherit; font:inherit; cursor:pointer; position:relative; appearance:none; }
      .stat-info-trigger:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .stat-val { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
      .stat-label { font-size:10px; font-weight:500; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
      .stat-arrow-up { color:#4ade80; }
      .stat-arrow-down { color:#f87171; }
      .stat-arrow-same { color:var(--accent); }
      /* --- Statistic explanation sheet --- */
      .info-dialog { width:min(100%,560px); max-height:min(82vh,680px); margin:auto auto 0; padding:0; color:var(--text); background:var(--card); border:1px solid var(--card-border); border-radius:18px 18px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.45); }
      .info-dialog::backdrop { background:rgba(0,0,0,.58); }
      .info-sheet { padding:20px max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); overflow:auto; }
      .info-sheet-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:12px; }
      .info-sheet-title { margin:0; font-size:19px; line-height:1.25; }
      .info-sheet-close { flex-shrink:0; width:34px; height:34px; padding:0; border:1px solid var(--card-border); border-radius:50%; background:#1c1c2e; color:var(--text); font-size:22px; line-height:1; cursor:pointer; }
      .info-sheet-body { color:var(--text-muted); font-size:14px; line-height:1.55; }
      .info-sheet-body p { margin:0 0 12px; }
      .info-sheet-body p:last-child { margin-bottom:0; }
      .info-sheet-body code { display:block; margin:8px 0; padding:9px 10px; color:var(--text); background:var(--bg); border:1px solid var(--card-border); border-radius:8px; font-size:12px; line-height:1.45; white-space:normal; }
      @media (min-width:600px) {
        .info-dialog { margin:auto; border-radius:18px; }
      }

      /* --- Dashboard --- */
      .dash-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
      .dash-overall { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:24px; }
      .dash-overall .stat { background:var(--card); border:1px solid var(--card-border); }
      .dash-cat { background:var(--card); border:1px solid var(--card-border); border-radius:var(--r); padding:18px; margin-bottom:14px; }
      .dash-cat-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
      .dash-cat-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; }
      .dash-ex-row { display:flex; align-items:center; gap:10px; padding:6px 0; }
      .dash-ex-row + .dash-ex-row { border-top:1px solid rgba(255,255,255,.05); }
      .dash-ex-name { font-size:12px; font-weight:500; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .dash-spark { display:flex; align-items:flex-end; gap:1px; height:20px; }
      .dash-spark-bar { width:4px; border-radius:1px; min-height:1px; }

      /* --- Zone dot --- */
      .tile-zone { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
      .zone-green  { background:#4ade80; }
      .zone-yellow { background:#fbbf24; }
      .zone-red    { background:#f87171; }
      .zone-grey   { background:rgba(232,232,240,.25); }

      /* --- Animations --- */
      .fade { animation: fade .2s ease; } @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
      @keyframes slideInRight  { from { opacity:0; transform:translateX(60px) } to { opacity:1; transform:none } }
      @keyframes slideInLeft   { from { opacity:0; transform:translateX(-60px) } to { opacity:1; transform:none } }
      .slide-right .card { animation: slideInRight .22s cubic-bezier(.16,1,.3,1); }
      .slide-left  .card { animation: slideInLeft  .22s cubic-bezier(.16,1,.3,1); }
      html, body { touch-action: manipulation; }
      .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <dialog class="info-dialog" id="stat-info-dialog" aria-labelledby="stat-info-title">
      <div class="info-sheet">
        <div class="info-sheet-head">
          <h2 class="info-sheet-title" id="stat-info-title"></h2>
          <button class="info-sheet-close" id="stat-info-close" type="button" aria-label="Close explanation">&times;</button>
        </div>
        <div class="info-sheet-body" id="stat-info-body"></div>
      </div>
    </dialog>

    <script>
      /* ====== CONFIG ====== */
      const EXERCISES = [
          /* Motor control */
          {id:"side-plank",         name:"Side Plank",           unit:"sec",  clr:"motor", loadable:true},
          {id:"bird-dog",           name:"Bird-Dog",             unit:"reps", clr:"motor", loadable:true},
          {id:"mcgill-curlup",      name:"McGill Curl-Up",       unit:"sec",  clr:"motor"},
          {id:"dead-bug",           name:"Dead Bug",             unit:"reps", clr:"motor"},
          {id:"cat-camel",          name:"Cat\u2013Camel",       unit:"reps", clr:"motor"},

          /* Rehab strengthening */
          {id:"glute-bridge",		  name:"Glute Bridge",			 unit:"reps", clr:"rehab", loadable:true},
          {id:"clamshell",		  name:"Clamshell",			 unit:"reps", clr:"rehab"},
          {id:"draken",			  name:"Draken",			 unit:"reps", clr:"rehab"},
          {id:"rubber-band-archer",	  name:"Rubber Band Archer Pull",	 unit:"reps", clr:"rehab"},
          {id:"rubber-band-row",	  name:"Rubber Band Row",		 unit:"reps", clr:"rehab"},
          {id:"banded-air-cycling",	  name:"Banded Air Cycling",		 unit:"reps", clr:"rehab"},
          {id:"sprint-pull",		  name:"Sprint Pull",			 unit:"reps", clr:"rehab"},
          {id:"banded-er-90",		  name:"Banded 90/90 External Rotation", unit:"reps", clr:"rehab"},
          {id:"banded-serratus-punch",	  name:"Banded Serratus Punch",		 unit:"reps", clr:"rehab"},
          {id:"banded-pull-apart-raise",  name:"Banded Pull-Apart with Raise",	 unit:"reps", clr:"rehab"},
          {id:"arm-circles",		  name:"Arm Circles",			 unit:"reps", clr:"rehab"},
          {id:"elevated-hip-flexor-hold", name:"Elevated Hip Flexor Hold",	 unit:"reps", clr:"rehab"},
          {id:"band-squat-lateral-step",  name:"Squat", 	 unit:"reps", clr:"rehab", loadable:true},

          /* Strength */
          {id:"pushups",            name:"Push-Ups",             unit:"reps", clr:"strength"},
          {id:"pullups",            name:"Pull-Ups",             unit:"reps", clr:"strength"},
          {id:"dips",               name:"Dips",                 unit:"reps", clr:"strength"},
          {id:"lateral-raise",      name:"Lateral Raise",        unit:"reps", clr:"strength", loadable:true},
          {id:"shoulder-press",      name:"Shoulder Press",       unit:"reps", clr:"strength", loadable:true},
          {id:"shrugs",              name:"Shrugs",               unit:"reps", clr:"strength", loadable:true},
          {id:"deadlift",            name:"Deadlift",             unit:"reps", clr:"strength", loadable:true},
          {id:"split-squat",         name:"Split Squat",          unit:"reps", clr:"strength", loadable:true},

          /* Conditioning */
          {id:"walking",            name:"Walking",              unit:"100m", clr:"cond"},
          {id:"running",            name:"Running",              unit:"100m", clr:"cond"},
          {id:"swimming",           name:"Swimming",             unit:"25m", clr:"cond"},
          {id:"skiing",             name:"Skiing",               unit:"km",   clr:"cond"}
      ];

      const CLR_MAP = { motor:'var(--clr-motor)', rehab:'var(--clr-rehab)', strength:'var(--clr-strength)', cond:'var(--clr-cond)' };
      const SECTION_LABELS = { motor:'Motor Control', rehab:'Rehab Strengthening', strength:'Strength', cond:'Conditioning' };
      // Loadable exercises gain a weight stepper and a Weight chart. WEIGHT_STEP
      // is how much one +/- tap changes the load, in WEIGHT_UNIT. The middle
      // stepper is labelled from the unit, so timed and counted exercises share
      // one layout without special-casing.
      const WEIGHT_UNIT = 'kg';
      const WEIGHT_STEP = 0.5;
      const UNIT_LABEL = { reps:'Reps', sec:'Seconds' };

      const WINDOW_DAYS = 14;
      const MS_PER_DAY = 86400000;

      const STAT_INFO = {
          'zone-volume': {
              title: 'Zone position',
              body: `<p>Your current volume EWMA as a percentage of your best established green-zone baseline.</p>
                     <code>Zone position = current 14-day EWMA ÷ best 60-day baseline EWMA × 100%</code>
                     <p>Below 100% is grey, 100–115% is green, above 115% is yellow, and above 130% is red. The baseline needs at least 90 days of history before this statistic appears.</p>`
          },
          'week-volume': {
              title: 'Weekly volume',
              body: `<p>Total volume recorded today and during the previous six days. The value in parentheses covers the seven days immediately before that. The arrow shows which total is larger.</p>
                     <code>Weekly volume = Σ(sets × reps or seconds) over 7 days</code>`
          },
          'ewma-volume': {
              title: 'EWMA per week',
              body: `<p>A smoothed estimate of your current weekly volume. Recent sessions matter more than older sessions, so the value responds to change without jumping as sharply as a raw weekly total.</p>
                     <code>EWMA/wk = 7 × Σ(value × 2<sup>−age/14</sup>) ÷ Σ(2<sup>−age/14</sup>)</code>
                     <p>It uses a 90-day calendar window (today and the previous 89 days). Influence halves every 14 days; unrecorded days count as zero. The ×7 converts the weighted daily average into a weekly rate.</p>`
          },
          'trend-volume': {
              title: 'Green-zone trend per month',
              body: `<p>The growth rate of the green zone's lower edge, expressed as a percentage per 30 days. It follows the running-best slow baseline—not the blue display-EWMA curve.</p>
                     <code>b = Σ((day − mean day) × (green baseline − mean baseline)) ÷ Σ((day − mean day)²)<br>Trend/mo = 30 × b ÷ mean green baseline × 100%</code>
                     <p>It uses at most the latest 90 days and never includes dates before the green zone activates, 90 calendar days after the first recorded volume. Because the green baseline can only ratchet upward, this trend cannot meaningfully be negative. It is a linear rate, not compounded growth.</p>`
          },
          'green-volume': {
              title: 'Green zone per week',
              body: `<p>The weekly-volume range anchored to the highest slow baseline you have established. It is designed to move only after sustained training.</p>
                     <code>Baseline/wk = 7 × Σ(value × 2<sup>−age/60</sup>) ÷ Σ(2<sup>−age/60</sup>)<br>Green zone = best baseline to 1.15 × best baseline</code>
                     <p>The baseline uses a 60-day half-life, a 240-day window, and activates after 90 days of history. Its historical best can rise but does not fall.</p>`
          },
          'ewma-best-volume': {
              title: 'Best EWMA per week',
              body: `<p>The highest value your 14-day volume EWMA has reached anywhere in the exercise's recorded history.</p>
                     <code>EWMA/wk best = max(all historical daily EWMA/wk values)</code>
                     <p>Unlike Best week, this rewards a high volume sustained across multiple sessions rather than one exceptional seven-day period.</p>`
          },
          'best-week': {
              title: 'Best week',
              body: `<p>The largest volume recorded in any sliding seven-day period in this exercise's history.</p>`
          },
          'all-time': {
              title: 'All-time volume',
              body: `<p>The sum of all recorded volume for this exercise across its complete history.</p>`
          },
          'days-recorded': {
              title: 'Days recorded',
              body: `<p>The number of calendar days on which this exercise has a recorded volume greater than zero.</p>`
          },
          'since-volume': {
              title: 'Days since first record',
              body: `<p>Days since this exercise was first recorded with a volume greater than zero.</p>`
          },
          'zone-weight': {
              title: 'Weight zone position',
              body: `<p>Your current smoothed weight level as a percentage of your best established weight baseline.</p>
                     <code>Zone position = current weight EWMA ÷ best 60-day weight EWMA × 100%</code>
                     <p>Below 100% is grey, 100–115% is green, above 115% is yellow, and above 130% is red. It activates after 90 days of logged-weight history.</p>`
          },
          'weight-level': {
              title: 'Weight level',
              body: `<p>A 14-day-half-life EWMA of the weights used during recorded sessions.</p>
                     <code>Weight level = Σ(weight × 2<sup>−age/14</sup>) ÷ Σ(2<sup>−age/14</sup>)</code>
                     <p>It considers a 90-day calendar window. Only performed days enter the average, including a deliberately logged 0 kg; rest days do not pull the level toward zero.</p>`
          },
          'green-weight': {
              title: 'Weight green zone',
              body: `<p>The load range anchored to the highest slow weight baseline you have established.</p>
                     <code>Baseline = Σ(weight × 2<sup>−age/60</sup>) ÷ Σ(2<sup>−age/60</sup>)<br>Green zone = best baseline to 1.15 × best baseline</code>
                     <p>Only performed days enter the average, including deliberately logged 0 kg sessions. It uses a 60-day half-life, a 240-day window, and activates after 90 days of history.</p>`
          },
          'trend-weight': {
              title: 'Weight green-zone trend per month',
              body: `<p>The growth rate of the weight green zone's lower edge, expressed as a percentage per 30 days. It follows the running-best slow weight baseline—not the current smoothed weight level.</p>
                     <code>b = Σ((day − mean day) × (green baseline − mean baseline)) ÷ Σ((day − mean day)²)<br>Trend/mo = 30 × b ÷ mean green baseline × 100%</code>
                     <p>It uses at most the latest 90 days and never includes dates before the weight green zone activates, 90 calendar days after the first logged load. It is a linear rate and cannot meaningfully be negative because the baseline only ratchets upward.</p>`
          },
          'ewma-best-weight': {
              title: 'Best weight EWMA',
              body: `<p>The highest 14-day smoothed weight level reached in this exercise's recorded history.</p>
                     <code>EWMA best = max(all historical daily weight EWMA values)</code>`
          },
          'heaviest-weight': {
              title: 'Heaviest weight',
              body: `<p>The greatest individual weight recorded for this exercise.</p>`
          },
          'latest-weight': {
              title: 'Latest weight',
              body: `<p>The external load recorded in the most recent performed session, including 0 kg.</p>`
          },
          'days-weighted': {
              title: 'Weight sessions',
              body: `<p>The number of performed sessions with weight data. A deliberately logged 0 kg session is included.</p>`
          },
          'since-weight': {
              title: 'Days since weight tracking began',
              body: `<p>Days since the first performed session with weight data, including 0 kg.</p>`
          },
          'days-active-week': {
              title: 'Days active this week',
              body: `<p>The number of days during the sliding seven-day period ending today on which at least one exercise was recorded.</p>`
          },
          'done-today': {
              title: 'Exercises done today',
              body: `<p>The number of exercises with a volume greater than zero recorded today.</p>`
          }
      };

      const app = document.getElementById('app');
      const statInfoDialog = document.getElementById('stat-info-dialog');
      const statInfoTitle = document.getElementById('stat-info-title');
      const statInfoBody = document.getElementById('stat-info-body');
      const statInfoClose = document.getElementById('stat-info-close');
      let statInfoTrigger = null;

      function statTile(value, label, infoKey) {
          const infoAttrs = infoKey
              ? ` data-stat-info="${infoKey}" aria-label="${label}: show explanation"`
              : '';
          const tag = infoKey ? 'button type="button"' : 'div';
          const closeTag = infoKey ? 'button' : 'div';
          const triggerClass = infoKey ? ' stat-info-trigger' : '';
          return `<${tag} class="stat${triggerClass}"${infoAttrs}><div class="stat-val">${value}</div><div class="stat-label">${label}</div></${closeTag}>`;
      }

      function openStatInfo(key, trigger) {
          const info = STAT_INFO[key];
          if (!info) return;
          statInfoTrigger = trigger;
          statInfoTitle.textContent = info.title;
          statInfoBody.innerHTML = info.body;
          statInfoDialog.showModal();
      }

      document.addEventListener('click', (event) => {
          const trigger = event.target.closest('[data-stat-info]');
          if (trigger) openStatInfo(trigger.dataset.statInfo, trigger);
      });
      statInfoClose.addEventListener('click', () => statInfoDialog.close());
      statInfoDialog.addEventListener('click', (event) => {
          if (event.target === statInfoDialog) statInfoDialog.close();
      });
      statInfoDialog.addEventListener('close', () => {
          if (statInfoTrigger && statInfoTrigger.isConnected) statInfoTrigger.focus();
          statInfoTrigger = null;
      });

      const todayStr = () => new Date().toISOString().slice(0,10);
      const addDays = (d, n) => { const dt = new Date(d); dt.setUTCDate(dt.getUTCDate()+n); return dt; };
      const isoDate = (d) => new Date(d).toISOString().slice(0,10);
      const clamp = (v,min,max) => Math.min(max, Math.max(min, v));

      function keysFor(id, date) {
          return {
              count:  `ex:${id}:${date}:count`,
              sets:   `ex:${id}:${date}:sets`,
              reps:   `ex:${id}:${date}:reps`,
              weight: `ex:${id}:${date}:weight`
          };
      }

      /* Read the structured entry for a day.
         count is the canonical daily volume = sets × reps on new entries.
         Old days carry only count; sets defaults to 1, reps defaults to count. */
      function readEntry(id, date) {
          const k = keysFor(id, date);
          const count = parseInt(localStorage.getItem(k.count) || "0", 10) || 0;
          const setsRaw = localStorage.getItem(k.sets);
          const repsRaw = localStorage.getItem(k.reps);
          const weightRaw = localStorage.getItem(k.weight);
          const sets   = setsRaw   !== null ? (parseInt(setsRaw, 10)   || 0) : 1;
          const reps   = repsRaw   !== null ? (parseInt(repsRaw, 10)   || 0) : count;
          const weight = weightRaw !== null ? (parseFloat(weightRaw)   || 0) : 0;
          const weightRecorded = weightRaw !== null && count > 0;
          return { count, sets, reps, weight, weightRecorded };
      }

      /* Write a structured entry. count = sets × reps stays the canonical daily
         volume, so the volume engine reads it unchanged. Weight is recorded only
         for loadable exercises and only on performed days (count > 0), so the
         weight series never holds a load for a day that was not trained. */
      function writeEntry(id, date, ex, { sets, reps, weight }) {
          const k = keysFor(id, date);
          const s = Math.max(0, sets | 0);
          const r = Math.max(0, reps | 0);
          const count = s * r;
          localStorage.setItem(k.count, String(count));
          localStorage.setItem(k.sets,  String(s));
          localStorage.setItem(k.reps,  String(r));
          if (ex.loadable) {
              const w = count > 0 ? Math.max(0, weight || 0) : 0;
              localStorage.setItem(k.weight, String(w));
          }
      }
      function daysBetween(a, b) {
          const A = new Date(a), B = new Date(b);
          const aa = Date.UTC(A.getUTCFullYear(), A.getUTCMonth(), A.getUTCDate());
          const bb = Date.UTC(B.getUTCFullYear(), B.getUTCMonth(), B.getUTCDate());
          return Math.floor((bb - aa) / MS_PER_DAY);
      }
      function parseDateKey(k, id, field) {
          const pfx = `ex:${id}:`, sfx = `:${field}`;
          if (!k.startsWith(pfx) || !k.endsWith(sfx)) return null;
          const ds = k.slice(pfx.length, -sfx.length);
          return /^\d{4}-\d{2}-\d{2}$/.test(ds) ? ds : null;
      }

      /* ====== METRICS ======
         A metric is a per-day numeric series read from one storage field, with
         analytics options describing how it accumulates:
           volume  count  weekly accumulation (summed over the week, ×7)
           weight  kg     level averaged over the days actually trained
         The same EWMA / baseline / green-zone machinery serves both; the two
         flags below are the only difference between them. */
      const VOL_OPTS = { weekly: true,  activeOnly: false };
      const WT_OPTS  = { weekly: false, activeOnly: true  };

      function seriesFor(id, field) {
          const result = {};
          for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (!k) continue;
              const ds = parseDateKey(k, id, field);
              if (ds) {
                  const v = parseFloat(localStorage.getItem(k) || "0");
                  if (v > 0) result[ds] = v;
              }
          }
          return result;
      }
      const volumeSeries = (id) => seriesFor(id, 'count');
      /* A performed 0 kg session is real weight data (for example, returning to
         bodyweight). Keep it distinct from an absent day so progress and deloads
         are represented honestly. */
      function weightSeries(id) {
          const result = {};
          for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (!k) continue;
              const ds = parseDateKey(k, id, 'weight');
              if (!ds) continue;
              const count = parseInt(localStorage.getItem(keysFor(id, ds).count) || "0", 10) || 0;
              const value = parseFloat(localStorage.getItem(k));
              if (count > 0 && Number.isFinite(value) && value >= 0) result[ds] = value;
          }
          return result;
      }

      function getAllData() {
          const result = {};
          for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (!k || !k.startsWith('ex:')) continue;
              result[k] = localStorage.getItem(k);
          }
          return result;
      }

      const EWMA_HALF_LIFE = 14;
      const EWMA_LOOKBACK = 90;
      const EWMA_LAMBDA = Math.LN2 / EWMA_HALF_LIFE;

      const BASELINE_HALF_LIFE = 60;
      const BASELINE_LOOKBACK = BASELINE_HALF_LIFE * 4;
      const BASELINE_LAMBDA = Math.LN2 / BASELINE_HALF_LIFE;

      const BASELINE_MIN_DAYS = 90;
      const ZONE_TOP = 1.15;

      /* Exponentially-weighted average of a daily array ending at endIndex.
         weekly:     scale the daily average to a weekly total (×7), for accumulations.
         activeOnly: count only days that hold data, giving a sustained level rather
                     than a rate dragged toward zero by rest days. */
      function ewmaAt(values, endIndex, lambda, lookback, opts) {
          let wSum = 0, wTotal = 0;
          for (let i = 0; i < lookback; i++) {
              const value = values[endIndex - i];
              const present = value !== undefined;
              if (opts.activeOnly && !present) continue;
              const v = present ? value : 0;
              const w = Math.exp(-lambda * i);
              wSum += w * v;
              wTotal += w;
          }
          if (wTotal === 0) return 0;
          const avg = wSum / wTotal;
          return opts.weekly ? avg * 7 : avg;
      }

      function linRegSlope(ys) {
          const n = ys.length;
          if (n < 2) return 0;
          let sx = 0, sy = 0, sxy = 0, sxx = 0;
          for (let i = 0; i < n; i++) {
              sx += i; sy += ys[i]; sxy += i * ys[i]; sxx += i * i;
          }
          const denom = n * sxx - sx * sx;
          if (denom === 0) return 0;
          return (n * sxy - sx * sy) / denom;
      }

      // One daily history supplies statistics and chart samples. Missing days
      // remain zero for volume, while weight averages only recorded sessions.
      function analyzeSeries(data, opts, endDate = todayStr()) {
          const dates = Object.keys(data).sort();
          const history = [];
          let baseline = 0, bestDisplay = 0, bestWeek = 0;
          const span = dates.length ? daysBetween(dates[0], endDate) : -1;
          const calendar = Array.from({ length: Math.max(0, span + 1) }, (_, day) => isoDate(addDays(dates[0], day)));
          const dailyValues = calendar.map(date => data[date]);
          for (const [day, date] of calendar.entries()) {
              const value = ewmaAt(dailyValues, day, EWMA_LAMBDA, EWMA_LOOKBACK, opts);
              if (day >= BASELINE_MIN_DAYS) {
                  const candidate = ewmaAt(dailyValues, day, BASELINE_LAMBDA, BASELINE_LOOKBACK, opts);
                  baseline = Math.max(baseline, candidate);
              }
              bestDisplay = Math.max(bestDisplay, value);
              const weekTotal = dailyValues.slice(Math.max(0, day - 6), day + 1).reduce((sum, value) => sum + (value || 0), 0);
              bestWeek = Math.max(bestWeek, weekTotal);
              history.push({ date, value, baseline });
          }
          const eligible = history.slice(BASELINE_MIN_DAYS).slice(-90);
          const baselines = eligible.map(point => point.baseline);
          const mean = baselines.reduce((sum, value) => sum + value, 0) / baselines.length;
          const trend = baselines.length < 2 || !mean ? null : 30 * linRegSlope(baselines) / mean * 100;
          const values = Object.values(data);
          return {
              data, dates, history, endDate, baseline, bestDisplay, bestWeek, trend,
              current: history.at(-1)?.value ?? 0,
              total: values.reduce((sum, value) => sum + value, 0),
              heaviest: values.reduce((best, value) => Math.max(best, value), 0),
              latest: data[dates.at(-1)],
              thisWeek: periodTotal(data, endDate),
              lastWeek: periodTotal(data, addDays(endDate, -7))
          };
      }

      function periodTotal(data, endDate, days = 7) {
          let total = 0;
          for (let age = 0; age < days; age++) total += data[isoDate(addDays(endDate, -age))] || 0;
          return total;
      }

      function zoneData(analysis, numWeeks, offsetWeeks) {
          if (!analysis.dates.length) return { curve: [], band: [] };
          const end = addDays(analysis.endDate, -offsetWeeks * 7);
          const curve = [];
          for (let age = numWeeks * 7 - 1; age >= 0; age--) {
              const date = isoDate(addDays(end, -age));
              const index = daysBetween(analysis.dates[0], date);
              const point = analysis.history[index];
              curve.push(point || { date, value: 0, baseline: 0 });
          }
          const band = [];
          for (let week = numWeeks - 1; week >= 0; week--) {
              const point = curve[curve.length - 1 - week * 7];
              band.push({ date: point.date, target: point.baseline });
          }
          return { curve, band };
      }

      function zonePosition(data, opts) {
          const { baseline, current } = analyzeSeries(data, opts);
          if (baseline === 0) return { cls: 'zone-grey', label: 'Insufficient data', pct: null };
          const ratio = current / baseline;
          const pct = Math.round(ratio * 100);
          if (ratio < 1.00 - 1e-9) return { cls: 'zone-grey',   label: `${pct}% of peak`, pct };
          if (ratio <= ZONE_TOP) return { cls: 'zone-green',  label: `${pct}% of peak, green zone`, pct };
          if (ratio <= 1.30)     return { cls: 'zone-yellow', label: `${pct}% of peak, ease off`, pct };
          return { cls: 'zone-red', label: `${pct}% of peak, back off`, pct };
      }

      function progressZone(id) { return zonePosition(volumeSeries(id), VOL_OPTS); }

      /* ====== EXPORT / IMPORT ====== */
      function exportData() {
          const data = getAllData();
          const payload = {
              version: 1,
              exported: new Date().toISOString(),
              entries: Object.keys(data).length,
              data: data
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `exercises-backup-${todayStr()}.json`;
          a.click();
          URL.revokeObjectURL(url);
      }

      function importData() {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.json';
          input.addEventListener('change', () => {
              const file = input.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                  try {
                      const payload = JSON.parse(reader.result);
                      if (!payload.data || typeof payload.data !== 'object') {
                          alert('Invalid backup file: missing data.');
                          return;
                      }
                      const keys = Object.keys(payload.data).filter(k => k.startsWith('ex:'));
                      if (keys.length === 0) {
                          alert('No exercise data found in file.');
                          return;
                      }
                      let newCount = 0, overwriteCount = 0;
                      for (const k of keys) {
                          const existing = localStorage.getItem(k);
                          if (existing === null) newCount++;
                          else if (existing !== payload.data[k]) overwriteCount++;
                      }
                      let msg = `Found ${keys.length} entries.\n\n`;
                      msg += `  ${newCount} new entries will be added.\n`;
                      if (overwriteCount > 0) {
                          msg += `  ${overwriteCount} existing entries differ and will be OVERWRITTEN.\n`;
                      }
                      msg += `\nProceed?`;
                      if (!confirm(msg)) return;
                      for (const k of keys) {
                          localStorage.setItem(k, payload.data[k]);
                      }
                      alert(`Imported ${keys.length} entries.`);
                      route();
                  } catch (e) {
                      alert('Failed to read backup file: ' + e.message);
                  }
              };
              reader.readAsText(file);
          });
          input.click();
      }

      /* ---------- HOME ---------- */
      function renderHome() {
          document.title = "Exercises";
          const today = todayStr();

          // Group exercises by category for section headers
          let html = `<h1>Exercises</h1>
    <div class="toolbar">
      <a class="toolbar-btn" href="#dashboard" style="text-decoration:none">Dashboard</a>
      <button class="toolbar-btn" id="btn-export">Export Backup</button>
      <button class="toolbar-btn" id="btn-import">Import Backup</button>
    </div>`;

          let lastClr = null;
          let listOpen = false;
          for (const x of EXERCISES) {
              if (x.clr !== lastClr) {
                  if (listOpen) html += '</div>';
                  html += `<h2 class="section" style="color:${CLR_MAP[x.clr]}">${SECTION_LABELS[x.clr]}</h2><div class="list fade">`;
                  listOpen = true;
                  lastClr = x.clr;
              }
              const count = parseInt(localStorage.getItem(keysFor(x.id, today).count) || "0", 10);
              const c = isNaN(count) ? 0 : count;
              const done = c > 0;
              const zone = progressZone(x.id);
              html += `
      <a class="list-item${done?' done':''}" href="#${x.id}" aria-label="${x.name}" style="--item-accent:${CLR_MAP[x.clr]}">
        <div class="list-item-text">
          <div class="list-item-name" style="color:${CLR_MAP[x.clr]}">${x.name}</div>
        </div>
        <div class="list-item-right">
          <div class="list-item-count">
            <span class="list-item-count-val">${c > 0 ? c : '\u2014'}</span>
            <span class="list-item-count-unit">${x.unit}</span>
          </div>
          <span class="tile-zone ${zone.cls}" title="${zone.label}"></span>
        </div>
      </a>`;
          }
          if (listOpen) html += '</div>';
          html += `<div class="muted" id="app-version" style="text-align:center;margin-top:24px"></div>`;

          app.innerHTML = html;
          document.getElementById('btn-export').addEventListener('click', exportData);
          document.getElementById('btn-import').addEventListener('click', importData);

          fetch('./service-worker.js')
              .then(r => r.text())
              .then(text => {
                  const m = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
                  const el = document.getElementById('app-version');
                  if (m && el) el.textContent = 'v' + m[1];
              })
              .catch(() => {});
      }

      /* ---------- SWIPE STATE ---------- */
      let detailView = 'daily';   // 'daily' | 'volume' | 'weight', persisted across exercises
      let slideDirection = null;

      function setupSwipe(cardEl) {
          let sx = 0, sy = 0, st = 0, lx = 0, ly = 0, active = false;
          cardEl.style.touchAction = 'pan-y';
          cardEl.addEventListener('touchstart', (e) => {
              if (e.target.closest('canvas, button, input')) return;
              const t = e.touches[0];
              sx = lx = t.clientX; sy = ly = t.clientY; st = Date.now(); active = true;
          }, {passive:true});
          cardEl.addEventListener('touchmove', (e) => {
              if (!active) return;
              const t = e.touches[0];
              lx = t.clientX; ly = t.clientY;
          }, {passive:true});
          cardEl.addEventListener('touchend', () => {
              if (!active) return;
              active = false;
              const dx = lx - sx, dy = ly - sy, dt = Date.now() - st;
              if (Math.abs(dx) > 50 && Math.abs(dy) < 60 && dt < 500) {
                  const dir = dx > 0 ? -1 : 1;
                  const hash = location.hash.replace(/^#/, '');
                  const idx = EXERCISES.findIndex(ex => ex.id === hash);
                  if (idx === -1) return;
                  const next = idx + dir;
                  if (next >= 0 && next < EXERCISES.length) {
                      slideDirection = dir > 0 ? 'slide-left' : 'slide-right';
                      location.hash = EXERCISES[next].id;
                  }
              }
          }, {passive:true});
      }

      /* ---------- DETAIL ---------- */
      function renderDetail(id) {
          const ex = EXERCISES.find(e => e.id === id);
          if (!ex) { location.hash = ""; return; }

          const accentColor = CLR_MAP[ex.clr] || 'var(--accent)';
          const midLabel = UNIT_LABEL[ex.unit] || ex.unit;

          // Chart views available for this exercise; Weight only when loadable.
          const views = ex.loadable ? ['daily', 'volume', 'weight'] : ['daily', 'volume'];
          let view = views.includes(detailView) ? detailView : 'daily';

          // Stepper rows: sets and the unit-named middle field for every exercise;
          // weight only for loadable ones.
          const fields = [
              { key: 'sets', label: 'Sets',   unit: '' },
              { key: 'reps', label: midLabel, unit: '' }
          ];
          if (ex.loadable) fields.push({ key: 'weight', label: 'Weight', unit: WEIGHT_UNIT });

          const stepperRows = fields.map(f => `
        <div class="step-row">
          <div class="step-label">${f.label}</div>
          <button class="btn step-btn" data-field="${f.key}" data-dir="-1" aria-label="decrease ${f.label}">&ndash;</button>
          <div class="step-val" data-field="${f.key}" style="color:${accentColor}">0</div>
          <button class="btn step-btn" data-field="${f.key}" data-dir="1" aria-label="increase ${f.label}">+</button>
          <div class="muted step-unit">${f.unit}</div>
        </div>`).join('');

          const segButtons = views.map(v =>
              `<button data-view="${v}"${v === view ? ' class="active"' : ''}>${v[0].toUpperCase() + v.slice(1)}</button>`
          ).join('');

          document.title = ex.name;

          const slideClass = slideDirection || '';
          slideDirection = null;
          app.innerHTML = `
    <a class="back" href="#">&larr; All exercises</a>
    <div class="${slideClass}" id="slide-wrap">
    <div class="card${slideClass ? '' : ' fade'}">
      <div class="row">
        <h1 style="margin:0;font-size:20px;color:${accentColor}">${ex.name}</h1>
        <div>
          <label for="day" style="margin:0 0 4px;font-size:11px">Date</label>
          <input id="day" type="date" value="${todayStr()}">
        </div>
      </div>

      <div class="steppers" id="steppers">${stepperRows}</div>
      <div class="entry-total muted" id="entry-total"></div>
      <div class="note" id="status">Saved</div>

      <div class="chart-wrap">
        <div class="chart-head">
          <div class="muted" id="rangeLabel"></div>
          <div class="seg" id="view-seg">${segButtons}</div>
        </div>
        <canvas id="chart" width="600" height="200"></canvas>
      </div>

      <div class="stats" id="stats"></div>
    </div>
    </div>`;

          const $day      = document.getElementById('day');
          const $steppers = document.getElementById('steppers');
          const $total    = document.getElementById('entry-total');
          const $status   = document.getElementById('status');
          const $chart    = document.getElementById('chart');
          const $label    = document.getElementById('rangeLabel');
          const $seg      = document.getElementById('view-seg');
          const $stats    = document.getElementById('stats');

          const showSaved = () => { $status.textContent = 'Saved'; $status.style.opacity='1'; setTimeout(()=>{$status.style.opacity='.5';},250); };
          const formatAvg = (v) => v % 1 === 0 ? String(v) : v.toFixed(1);
          const daysSince = (date) => date ? String(daysBetween(date, todayStr())) : '—';
          function trendArrow(current, previous) {
              if (current > previous) return '<span class="stat-arrow-up">&#9650;</span>';
              if (current < previous) return '<span class="stat-arrow-down">&#9660;</span>';
              return '<span class="stat-arrow-same">&#9654;</span>';
          }
          // Most recent recorded load, used to prefill the weight stepper so a
          // performed day defaults to last session's weight unless changed.
          const lastWeight = (() => {
              if (!ex.loadable) return 0;
              const ws = weightSeries(id);
              const ds = Object.keys(ws).sort();
              return ds.length ? ws[ds[ds.length - 1]] : 0;
          })();

          /* ---------- entry state ---------- */
          let entry = { sets: 1, reps: 0, weight: 0 };

          function renderSteppers() {
              for (const f of fields) {
                  const el = $steppers.querySelector(`.step-val[data-field="${f.key}"]`);
                  if (el) el.textContent = f.key === 'weight' ? formatAvg(entry.weight) : String(entry[f.key]);
              }
              const count = entry.sets * entry.reps;
              const load = ex.loadable && entry.weight > 0 ? ` @ ${formatAvg(entry.weight)} ${WEIGHT_UNIT}` : '';
              $total.textContent = count > 0 ? `${entry.sets} × ${entry.reps}${load} = ${count} ${ex.unit}` : 'Not logged this day';
          }

          function loadEntry(dateStr) {
              const e = readEntry(id, dateStr);
              if (ex.loadable && !e.weightRecorded) e.weight = lastWeight;
              entry = { sets: e.sets, reps: e.reps, weight: e.weight };
              renderSteppers();
          }

          function persist(dateStr) {
              writeEntry(id, dateStr, ex, entry);
              analyses.clear();
              renderSteppers();
              showSaved();
              redrawAll();
          }

          $steppers.addEventListener('click', (e) => {
              const btn = e.target.closest('.step-btn');
              if (!btn) return;
              const key = btn.dataset.field;
              const dir = parseInt(btn.dataset.dir, 10);
              if (key === 'weight') {
                  entry.weight = Math.max(0, Math.round((entry.weight + dir * WEIGHT_STEP) * 100) / 100);
              } else {
                  entry[key] = Math.max(0, (entry[key] | 0) + dir);
              }
              persist($day.value);
          }, {passive:true});

          $day.addEventListener('change', () => { loadEntry($day.value); redrawAll(); });

          // Reuse analysis while panning or switching tabs; invalidate after edits.
          const analyses = new Map();
          function getAnalysis(metricKey) {
              const cached = analyses.get(metricKey);
              if (!cached || cached.endDate !== todayStr()) {
                  const weight = metricKey === 'weight';
                  const data = weight ? weightSeries(id) : volumeSeries(id);
                  analyses.set(metricKey, analyzeSeries(data, weight ? WT_OPTS : VOL_OPTS));
              }
              return analyses.get(metricKey);
          }

          /* ---------- stats ---------- */
          function metricStats(metric) {
              const isWeight = metric === 'weight';
              const summary = getAnalysis(metric);
              const u = WEIGHT_UNIT;
              if (isWeight && summary.dates.length === 0) {
                  return statTile('—', 'Zone position', 'zone-weight') + statTile('—', `Level ${u}`, 'weight-level') +
                      `<div class="stat" style="grid-column:1/-1"><div class="stat-label">No performed sessions yet. Complete one to start the weight chart—even at 0 kg.</div></div>`;
              }

              const base = summary.baseline;
              const zonePosition = base > 0 ? Math.round(summary.current / base * 100) + '%' : '—';
              const trendSign = summary.trend !== null && summary.trend > 0.05 ? '+' : '±';
              const trendValue = summary.trend === null ? '—' : Math.abs(summary.trend) < 0.05 ? '0' : formatAvg(summary.trend);
              const trendDisplay = summary.trend === null ? trendValue : `${trendSign}${trendValue}%`;
              const zoneRange = base <= 0 ? '—' : isWeight
                  ? `${formatAvg(base)}–${formatAvg(base * ZONE_TOP)}`
                  : `${Math.floor(base)}–${Math.ceil(base * ZONE_TOP)}`;
              const sinceFirst = daysSince(summary.dates[0]);

              // Each metric defines its values, labels and explanation keys in display order.
              const definitions = isWeight ? [
                  [zonePosition, 'Zone position', 'zone-weight'],
                  [formatAvg(summary.current), `Level ${u}`, 'weight-level'],
                  [zoneRange, `Green zone ${u}`, 'green-weight'],
                  [trendDisplay, 'Green trend/mo', 'trend-weight'],
                  [formatAvg(summary.bestDisplay), `EWMA best ${u}`, 'ewma-best-weight'],
                  [formatAvg(summary.heaviest), `Heaviest ${u}`, 'heaviest-weight'],
                  [formatAvg(summary.latest), `Latest ${u}`, 'latest-weight'],
                  [summary.dates.length, 'Weight sessions', 'days-weighted'],
                  [sinceFirst, 'Days since first', 'since-weight']
              ] : [
                  [zonePosition, 'Zone position', 'zone-volume'],
                  [`${trendArrow(summary.thisWeek, summary.lastWeek)} ${summary.thisWeek}`, `Wk vol (prev ${summary.lastWeek})`, 'week-volume'],
                  [formatAvg(summary.current), 'EWMA/wk', 'ewma-volume'],
                  [trendDisplay, 'Green trend/mo', 'trend-volume'],
                  [zoneRange, 'Green zone/wk', 'green-volume'],
                  [formatAvg(summary.bestDisplay), 'EWMA/wk best', 'ewma-best-volume'],
                  [summary.bestWeek, 'Best wk', 'best-week'],
                  [summary.total, `All-time ${ex.unit}`, 'all-time'],
                  [summary.dates.length, 'Days recorded', 'days-recorded'],
                  [sinceFirst, 'Days since first', 'since-volume']
              ];
              return definitions.map(([value, label, infoKey]) => statTile(value, label, infoKey)).join('');
          }

          function updateStats() {
              $stats.innerHTML = metricStats(view === 'weight' ? 'weight' : 'volume');
          }

          /* ---------- charts ---------- */
          const barColor = getComputedStyle(document.documentElement).getPropertyValue(`--clr-${ex.clr}`).trim() || '#6ea8fe';
          const chartBg  = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0c0c14';

          // Volume uses the smoothed green-zone chart. Weight uses raw session
          // bars below so changes in actual training load remain easy to read.
          const METRICS = {
              volume: { label: 'Volume EWMA/wk', unit: `${ex.unit}/wk` }
          };

          function prepCanvas() {
              const dpr = window.devicePixelRatio || 1;
              const cssW = $chart.clientWidth, cssH = $chart.clientHeight;
              $chart.width = Math.round(cssW * dpr);
              $chart.height = Math.round(cssH * dpr);
              const ctx = $chart.getContext('2d');
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              ctx.clearRect(0, 0, cssW, cssH);
              return { ctx, cssW, cssH };
          }

          function chartGeometry(cssW, cssH, maxV, leftPadding = 40) {
              const pad = { l: leftPadding, r: 8, t: 8, b: 24 };
              const w = cssW - pad.l - pad.r;
              const h = cssH - pad.t - pad.b;
              const toY = value => pad.t + h - (value / maxV) * h;
              return { pad, w, h, toY };
          }

          function drawChartAxes(ctx, { pad, w, h }, topLabel) {
              ctx.strokeStyle = 'rgba(255,255,255,0.1)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(pad.l, pad.t);
              ctx.lineTo(pad.l, pad.t + h);
              ctx.lineTo(pad.l + w, pad.t + h);
              ctx.stroke();

              ctx.fillStyle = 'rgba(255,255,255,0.45)';
              ctx.font = '11px -apple-system, system-ui, Arial';
              ctx.textAlign = 'right';
              ctx.textBaseline = 'middle';
              ctx.fillText('0', pad.l - 6, pad.t + h);
              ctx.fillText(topLabel, pad.l - 6, pad.t);
          }

          // --- daily bars (volume), split into one segment per set ---
          let maxOffsetDays = 0;
          let offsetDays = 0;
          let pxPerDay = 8;

          function computeBounds() {
              let minDS = todayStr(), hasAny = false;
              for (let i = 0; i < localStorage.length; i++) {
                  const k = localStorage.key(i);
                  if (!k) continue;
                  const ds = parseDateKey(k, id, 'count');
                  if (ds) { hasAny = true; if (ds < minDS) minDS = ds; }
              }
              const today = todayStr();
              maxOffsetDays = Math.max(0, daysBetween(hasAny ? minDS : today, today) - (WINDOW_DAYS - 1));
              offsetDays = clamp(offsetDays, 0, maxOffsetDays);
          }

          function getHistoryWindow(endISO, days) {
              const end = new Date(endISO);
              const start = addDays(end, -(days - 1));
              const dates = [], labels = [], counts = [], setsArr = [];
              for (let i = 0; i < days; i++) {
                  const ds = isoDate(addDays(start, i));
                  const e = readEntry(id, ds);
                  dates.push(ds);
                  labels.push(ds.slice(5));
                  counts.push(e.count);
                  setsArr.push(e.count > 0 ? Math.max(1, e.sets) : 0);
              }
              return { dates, labels, counts, setsArr, startISO: isoDate(start), endISO: isoDate(end) };
          }

          let activeChartPoints = [];

          function drawDaily() {
              const endISO = isoDate(addDays(new Date(todayStr()), -offsetDays));
              const { dates, labels, counts, setsArr, startISO, endISO: eISO } = getHistoryWindow(endISO, WINDOW_DAYS);
              const { ctx, cssW, cssH } = prepCanvas();

              const maxV = Math.max(5, ...counts);
              const plot = chartGeometry(cssW, cssH, maxV, 32);
              const { pad, w, h, toY } = plot;
              const barGap = 6;
              const barW = Math.max(4, (w - barGap * (counts.length - 1)) / counts.length);
              pxPerDay = w / WINDOW_DAYS;

              drawChartAxes(ctx, plot, String(maxV));

              const startX = pad.l;
              activeChartPoints = dates.map((date, i) => ({
                  date,
                  value: counts[i],
                  unit: ex.unit,
                  x: startX + i * (barW + barGap) + barW / 2
              }));
              for (let i = 0; i < counts.length; i++) {
                  const v = counts[i];
                  if (v <= 0) continue;
                  const x = startX + i * (barW + barGap);
                  const bh = (v / maxV) * h;
                  const y = toY(v);
                  const r = Math.min(3, barW / 2);

                  ctx.fillStyle = barColor;
                  ctx.globalAlpha = 0.7;
                  ctx.beginPath();
                  if (bh > r) {
                      ctx.moveTo(Math.round(x), Math.round(y + bh));
                      ctx.lineTo(Math.round(x), Math.round(y + r));
                      ctx.quadraticCurveTo(Math.round(x), Math.round(y), Math.round(x + r), Math.round(y));
                      ctx.lineTo(Math.round(x + barW - r), Math.round(y));
                      ctx.quadraticCurveTo(Math.round(x + barW), Math.round(y), Math.round(x + barW), Math.round(y + r));
                      ctx.lineTo(Math.round(x + barW), Math.round(y + bh));
                  } else {
                      ctx.rect(Math.round(x), Math.round(y), Math.round(barW), Math.round(bh));
                  }
                  ctx.fill();

                  // divider lines between sets, drawn in the background colour
                  const sets = setsArr[i];
                  if (sets > 1 && bh > 4) {
                      ctx.globalAlpha = 1;
                      ctx.strokeStyle = chartBg;
                      ctx.lineWidth = 1.5;
                      for (let s = 1; s < sets; s++) {
                          const dy = Math.round(pad.t + h - (s / sets) * bh);
                          ctx.beginPath();
                          ctx.moveTo(Math.round(x), dy);
                          ctx.lineTo(Math.round(x + barW), dy);
                          ctx.stroke();
                      }
                  }
              }
              ctx.globalAlpha = 1;

              ctx.fillStyle = 'rgba(255,255,255,0.4)';
              ctx.font = '10px -apple-system, system-ui, Arial';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'top';
              const step = Math.max(1, Math.ceil(labels.length / 5));
              for (let i = 0; i < labels.length; i += step) {
                  const x = startX + i * (barW + barGap) + barW / 2;
                  ctx.fillText(labels[i], Math.round(x), pad.t + h + 5);
              }

              $label.textContent = `${startISO}  →  ${eISO}`;
          }

          // --- generic zone chart: EWMA with running-best green band ---
          const ZONE_WEEKS = 26;
          let zoneOffsetWeeks = 0;
          let maxZoneOffset = 0;
          let pxPerWeek = 8;

          function drawMonthLabels(ctx, points, xForIndex, y) {
              const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
              const ticks = [];
              let previousMonth = '';
              for (let i = 0; i < points.length; i++) {
                  const monthKey = points[i].date.slice(0, 7);
                  if (monthKey === previousMonth) continue;
                  previousMonth = monthKey;
                  ticks.push({ index: i, x: xForIndex(i), month: parseInt(points[i].date.slice(5, 7), 10) - 1 });
              }

              // A partial oldest month can land just before the next label.
              // Prefer the full newer month rather than drawing two collisions.
              if (ticks.length > 1 && ticks[1].x - ticks[0].x < 38) ticks.shift();

              ctx.fillStyle = 'rgba(255,255,255,0.4)';
              ctx.font = '10px -apple-system, system-ui, Arial';
              ctx.textBaseline = 'top';
              let lastX = -Infinity;
              for (const tick of ticks) {
                  if (tick.x - lastX < 38) continue;
                  ctx.textAlign = tick.x < 52 ? 'left' : 'center';
                  ctx.fillText(monthNames[tick.month], tick.x, y);
                  lastX = tick.x;
              }
          }

          function computeZoneBounds(data) {
              const dates = Object.keys(data).sort();
              if (dates.length === 0) { maxZoneOffset = 0; return; }
              const firstDate = new Date(dates[0]);
              const today = new Date(todayStr());
              const totalWeeks = Math.floor((today - firstDate) / (7 * 864e5));
              maxZoneOffset = Math.max(0, totalWeeks - ZONE_WEEKS + 1);
              zoneOffsetWeeks = clamp(zoneOffsetWeeks, 0, maxZoneOffset);
          }

          function drawZone(metricKey) {
              const m = METRICS[metricKey];
              const analysis = getAnalysis(metricKey);
              computeZoneBounds(analysis.data);
              const { curve, band } = zoneData(analysis, ZONE_WEEKS, zoneOffsetWeeks);
              const { ctx, cssW, cssH } = prepCanvas();

              if (curve.length === 0) {
                  activeChartPoints = [];
                  $label.textContent = `${m.label}  —  no data yet`;
                  return;
              }

              const nd = curve.length;
              const nb = band.length;

              const allVals = curve.map(p => p.value)
                  .concat(band.flatMap(p => [p.target * ZONE_TOP, p.target]));
              const maxV = Math.max(5, ...allVals) * 1.1;
              const plot = chartGeometry(cssW, cssH, maxV);
              const { pad, w, h, toY } = plot;
              const curveX = i => pad.l + (i / (nd - 1)) * w;
              const bandX = i => pad.l + (i / (nb - 1)) * w;
              pxPerWeek = w / (nb - 1);
              activeChartPoints = curve.map((point, i) => ({
                  date: point.date,
                  value: point.value,
                  unit: m.unit,
                  x: curveX(i),
                  y: toY(point.value)
              }));

              const first = band.findIndex(p => p.target > 0);
              if (first >= 0) {
                  ctx.fillStyle = 'rgba(74,222,128,0.12)';
                  ctx.beginPath();
                  for (let i = first; i < nb; i++) ctx.lineTo(bandX(i), toY(band[i].target * ZONE_TOP));
                  for (let i = nb - 1; i >= first; i--) ctx.lineTo(bandX(i), toY(band[i].target));
                  ctx.closePath();
                  ctx.fill();

                  ctx.setLineDash([4, 4]);
                  ctx.strokeStyle = 'rgba(74,222,128,0.4)';
                  ctx.lineWidth = 1;
                  ctx.beginPath();
                  ctx.moveTo(bandX(first), toY(band[first].target));
                  for (let i = first + 1; i < nb; i++) ctx.lineTo(bandX(i), toY(band[i].target));
                  ctx.stroke();
                  ctx.beginPath();
                  ctx.moveTo(bandX(first), toY(band[first].target * ZONE_TOP));
                  for (let i = first + 1; i < nb; i++) ctx.lineTo(bandX(i), toY(band[i].target * ZONE_TOP));
                  ctx.stroke();
                  ctx.setLineDash([]);
              }

              drawChartAxes(ctx, plot, String(Math.round(maxV)));

              ctx.strokeStyle = barColor;
              ctx.lineWidth = 2;
              ctx.beginPath();
              for (let i = 0; i < nd; i++) {
                  const x = curveX(i), y = toY(curve[i].value);
                  if (i === 0) ctx.moveTo(x, y);
                  else ctx.lineTo(x, y);
              }
              ctx.stroke();

              if (nd >= 14) {
                  const vals = curve.map(p => p.value);
                  const slope = linRegSlope(vals);
                  const mean = vals.reduce((a, b) => a + b, 0) / nd;
                  const midX = (nd - 1) / 2;
                  const y0 = mean - slope * midX;
                  const y1 = mean + slope * (nd - 1 - midX);
                  ctx.setLineDash([6, 4]);
                  ctx.strokeStyle = slope > 0 ? 'rgba(74,222,128,0.6)' : slope < 0 ? 'rgba(248,113,113,0.6)' : 'rgba(255,255,255,0.3)';
                  ctx.lineWidth = 1.5;
                  ctx.beginPath();
                  ctx.moveTo(curveX(0), toY(y0));
                  ctx.lineTo(curveX(nd - 1), toY(y1));
                  ctx.stroke();
                  ctx.setLineDash([]);
              }

              drawMonthLabels(ctx, curve, curveX, pad.t + h + 5);

              $label.textContent = `${m.label}  —  ${curve[0].date} → ${curve[nd - 1].date}`;
          }

          // Raw per-session loads make the purpose of this view explicit:
          // compare the weight actually used over time. Zero is drawn as a
          // hollow baseline marker so returning to bodyweight stays visible.
          function drawWeightProgress() {
              const data = weightSeries(id);
              computeZoneBounds(data);
              const { ctx, cssW, cssH } = prepCanvas();
              const dates = Object.keys(data).sort();
              if (dates.length === 0) {
                  activeChartPoints = [];
                  $label.textContent = 'Session weight  —  no performed sessions yet';
                  return;
              }

              const end = addDays(new Date(todayStr()), -zoneOffsetWeeks * 7);
              const start = addDays(end, -(ZONE_WEEKS * 7 - 1));
              const startISO = isoDate(start);
              const endISO = isoDate(end);
              const sessions = dates
                  .filter(date => date >= startISO && date <= endISO)
                  .map(date => ({ date, value: data[date] }));
              const calendar = [];
              for (let i = 0; i < ZONE_WEEKS * 7; i++) calendar.push({ date: isoDate(addDays(start, i)) });

              const maxV = Math.max(5, ...sessions.map(point => point.value)) * 1.1;
              const plot = chartGeometry(cssW, cssH, maxV);
              const { pad, w, h, toY } = plot;
              const xForDate = date => pad.l + (daysBetween(startISO, date) / (ZONE_WEEKS * 7 - 1)) * w;
              pxPerWeek = w / (ZONE_WEEKS - 1);

              drawChartAxes(ctx, plot, formatAvg(maxV));

              const barW = Math.max(3, Math.min(8, w / (ZONE_WEEKS * 4)));
              activeChartPoints = sessions.map(point => ({
                  ...point,
                  unit: WEIGHT_UNIT,
                  x: xForDate(point.date),
                  y: toY(point.value)
              }));
              for (const point of activeChartPoints) {
                  if (point.value === 0) {
                      ctx.strokeStyle = barColor;
                      ctx.lineWidth = 2;
                      ctx.beginPath();
                      ctx.arc(point.x, pad.t + h - 3, 3, 0, Math.PI * 2);
                      ctx.stroke();
                      point.y = pad.t + h - 3;
                      continue;
                  }
                  const barHeight = Math.max(1, pad.t + h - point.y);
                  ctx.fillStyle = barColor;
                  ctx.globalAlpha = 0.75;
                  ctx.fillRect(point.x - barW / 2, point.y, barW, barHeight);
              }
              ctx.globalAlpha = 1;

              drawMonthLabels(ctx, calendar, i => pad.l + (i / (calendar.length - 1)) * w, pad.t + h + 5);
              $label.textContent = `Session weight (${WEIGHT_UNIT})  —  ${startISO} → ${endISO}`;
          }

          function drawActiveChart() {
              if (view === 'daily') drawDaily();
              else if (view === 'weight') drawWeightProgress();
              else drawZone(view);
          }

          function showChartValue(clientX) {
              if (activeChartPoints.length === 0) return;
              drawActiveChart();
              const x = clientX - $chart.getBoundingClientRect().left;
              let nearest = activeChartPoints[0];
              for (const point of activeChartPoints) {
                  if (Math.abs(point.x - x) < Math.abs(nearest.x - x)) nearest = point;
              }
              const ctx = $chart.getContext('2d');
              const cssH = $chart.clientHeight;
              ctx.strokeStyle = 'rgba(255,255,255,0.65)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(Math.round(nearest.x) + 0.5, 8);
              ctx.lineTo(Math.round(nearest.x) + 0.5, cssH - 24);
              ctx.stroke();
              if (Number.isFinite(nearest.y)) {
                  ctx.fillStyle = chartBg;
                  ctx.strokeStyle = barColor;
                  ctx.lineWidth = 2;
                  ctx.beginPath();
                  ctx.arc(nearest.x, nearest.y, 4, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.stroke();
              }
              $label.textContent = `${nearest.date}  —  ${formatAvg(nearest.value)} ${nearest.unit}`;
          }

          function redrawAll() {
              computeBounds();
              drawActiveChart();
              updateStats();
          }

          $seg.addEventListener('click', (e) => {
              const btn = e.target.closest('button[data-view]');
              if (!btn) return;
              view = btn.dataset.view;
              detailView = view;
              for (const b of $seg.querySelectorAll('button')) b.classList.toggle('active', b.dataset.view === view);
              drawActiveChart();
              updateStats();
          });

          /* ---------- one-finger pan, two-finger inspection ---------- */
          const chartPointers = new Map();
          let chartGesture = null;
          let panPointerId = null;
          let panX = 0;

          function twoFingerCenter() {
              const positions = [...chartPointers.values()];
              return (positions[0] + positions[1]) / 2;
          }

          function panChart(currentX) {
              const pixelsPerStep = view === 'daily' ? pxPerDay : pxPerWeek;
              const delta = Math.round((currentX - panX) / pixelsPerStep);
              if (delta === 0) return;
              if (view === 'daily') offsetDays = clamp(offsetDays + delta, 0, maxOffsetDays);
              else zoneOffsetWeeks = clamp(zoneOffsetWeeks + delta, 0, maxZoneOffset);
              panX += delta * pixelsPerStep;
              drawActiveChart();
          }

          $chart.addEventListener('pointerdown', (e) => {
              chartPointers.set(e.pointerId, e.clientX);
              $chart.setPointerCapture(e.pointerId);
              if (chartPointers.size === 1) {
                  chartGesture = 'pan';
                  panPointerId = e.pointerId;
                  panX = e.clientX;
                  $chart.style.cursor = 'grabbing';
              } else if (chartPointers.size === 2 && view !== 'daily') {
                  chartGesture = 'inspect';
                  $chart.style.cursor = 'crosshair';
                  showChartValue(twoFingerCenter());
              }
          });
          $chart.addEventListener('pointermove', (e) => {
              if (!chartPointers.has(e.pointerId)) {
                  if (e.pointerType === 'mouse' && view !== 'daily') showChartValue(e.clientX);
                  return;
              }
              chartPointers.set(e.pointerId, e.clientX);
              if (chartGesture === 'inspect' && chartPointers.size >= 2) {
                  showChartValue(twoFingerCenter());
                  return;
              }
              if (chartGesture === 'pan' && e.pointerId === panPointerId) panChart(e.clientX);
          });
          function endChartGesture(e) {
              chartPointers.delete(e.pointerId);
              try { $chart.releasePointerCapture(e.pointerId); } catch {}
              if (chartPointers.size === 0) {
                  chartGesture = null;
                  panPointerId = null;
                  $chart.style.cursor = 'grab';
                  drawActiveChart();
              }
          }
          $chart.addEventListener('pointerup', endChartGesture);
          $chart.addEventListener('pointercancel', endChartGesture);
          $chart.addEventListener('pointerleave', () => {
              if (chartPointers.size === 0 && view !== 'daily') drawActiveChart();
          });

          $chart.addEventListener('wheel', (e) => {
              e.preventDefault();
              const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
              if (view === 'daily') {
                  offsetDays = clamp(offsetDays + (delta > 0 ? -3 : 3), 0, maxOffsetDays);
              } else {
                  zoneOffsetWeeks = clamp(zoneOffsetWeeks + (delta > 0 ? -2 : 2), 0, maxZoneOffset);
              }
              drawActiveChart();
          }, {passive:false});

          const onKey = (e) => {
              if (view === 'daily') {
                  if (e.key === 'ArrowLeft')  { offsetDays = clamp(offsetDays + 1, 0, maxOffsetDays); drawActiveChart(); }
                  if (e.key === 'ArrowRight') { offsetDays = clamp(offsetDays - 1, 0, maxOffsetDays); drawActiveChart(); }
              } else {
                  if (e.key === 'ArrowLeft')  { zoneOffsetWeeks = clamp(zoneOffsetWeeks + 1, 0, maxZoneOffset); drawActiveChart(); }
                  if (e.key === 'ArrowRight') { zoneOffsetWeeks = clamp(zoneOffsetWeeks - 1, 0, maxZoneOffset); drawActiveChart(); }
              }
          };
          const viewEvents = new AbortController();
          document.addEventListener('keydown', onKey, { signal: viewEvents.signal });
          addEventListener('storage', (event) => {
              if (event.key !== null && !event.key.startsWith(`ex:${id}:`)) return;
              analyses.clear();
              loadEntry($day.value);
              redrawAll();
          }, { signal: viewEvents.signal });

          // init
          loadEntry($day.value);
          computeBounds();
          drawActiveChart();
          updateStats();
          addEventListener('resize', drawActiveChart, { passive: true, signal: viewEvents.signal });

          (function showSavedInit(){ $status.textContent='Saved'; $status.style.opacity='.5'; })();

          setupSwipe(document.querySelector('.card'));
          return () => viewEvents.abort();
      }

      /* ---------- DASHBOARD ---------- */
      function renderDashboard() {
          document.title = "Dashboard";
          const today = todayStr();
          const todayDate = new Date(today);

          // Overall stats: days active in sliding 7-day window
          let daysActiveThisWeek = 0;
          for (let i = 0; i < 7; i++) {
              const ds = isoDate(addDays(todayDate, -i));
              let anyDone = false;
              for (const ex of EXERCISES) {
                  const v = parseInt(localStorage.getItem(keysFor(ex.id, ds).count) || "0", 10);
                  if (v > 0) { anyDone = true; break; }
              }
              if (anyDone) daysActiveThisWeek++;
          }
          // Group by category (data-driven from clr field)
          const categories = [];
          const seen = new Set();
          for (const ex of EXERCISES) {
              if (!seen.has(ex.clr)) {
                  seen.add(ex.clr);
                  categories.push(ex.clr);
              }
          }

          let html = `
    <div class="dash-header">
      <h1>Dashboard</h1>
      <a class="back" href="#">&larr; Back</a>
    </div>
    <div class="dash-overall fade">
      ${statTile(`${daysActiveThisWeek}/7`, 'Days active this wk', 'days-active-week')}
      ${statTile(`${EXERCISES.filter(ex => parseInt(localStorage.getItem(keysFor(ex.id, today).count) || "0", 10) > 0).length}/${EXERCISES.length}`, 'Done today', 'done-today')}
    </div>`;

          for (const cat of categories) {
              const exs = EXERCISES.filter(e => e.clr === cat);
              const catLabel = SECTION_LABELS[cat] || cat;
              const catColor = CLR_MAP[cat] || 'var(--accent)';

              html += `<div class="dash-cat fade">
        <div class="dash-cat-header">
          <div class="dash-cat-title" style="color:${catColor}">${catLabel}</div>
        </div>
        `;

              for (const ex of exs) {
                  // Sparkline: last 7 days
                  const sparkVals = [];
                  for (let i = 6; i >= 0; i--) {
                      const ds = isoDate(addDays(todayDate, -i));
                      sparkVals.push(parseInt(localStorage.getItem(keysFor(ex.id, ds).count) || "0", 10));
                  }
                  const sparkMax = Math.max(1, ...sparkVals);
                  const sparkBars = sparkVals.map(v => {
                      const h = Math.max(1, Math.round((v / sparkMax) * 20));
                      const opacity = v > 0 ? '0.8' : '0.15';
                      return `<div class="dash-spark-bar" style="height:${h}px;background:${catColor};opacity:${opacity}"></div>`;
                  }).join('');

                  html += `
        <div class="dash-ex-row">
          <a href="#${ex.id}" class="dash-ex-name" style="color:var(--text);text-decoration:none">${ex.name}</a>
          <div class="dash-spark">${sparkBars}</div>
        </div>`;
              }

              html += `</div>`;
          }

          app.innerHTML = html;
      }

      /* ---------- ROUTER ---------- */
      let disposeView = null;
      function route() {
          disposeView?.();
          disposeView = null;
          const id = location.hash.replace(/^#/, '');
          if (id === 'dashboard') renderDashboard();
          else if (id) disposeView = renderDetail(id);
          else renderHome();
      }
      addEventListener('hashchange', route, {passive:true});
      route();
    </script>
  </body>
</html>
